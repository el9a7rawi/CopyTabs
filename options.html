<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الإعدادات المتقدمة — ناسخ روابط التبويبات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
  <style>
    body { width: auto; max-height: none; }
    .wrap { max-width: 640px; margin: 24px auto; padding: 0 16px; }
    .wrap .card { padding: 18px; }
  </style>
</head>
<body data-theme="light">
  <div class="wrap">
    <header class="header">
      <div class="brand">
        <img class="logo-img" src="icons/icon48.png" width="44" height="44" alt="CopyTabs" />
        <div>
          <h1>الإعدادات المتقدمة</h1>
          <p class="subtitle">تُحفظ تلقائيًا وتتزامن مع النافذة المنبثقة</p>
        </div>
      </div>
      <span class="count-badge">v1.0.0</span>
    </header>
    <section class="card">
      <div class="opts">
        <div class="opt"><label id="scopeLabel">نطاق النسخ</label>
          <div class="cselect" data-select="scope">
            <button type="button" class="cselect-btn" aria-labelledby="scopeLabel" aria-haspopup="listbox" aria-expanded="false">
              <span class="cselect-value"></span>
              <span class="cselect-chev" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>
            </button>
            <ul class="cselect-menu" role="listbox" aria-labelledby="scopeLabel" hidden></ul>
            <select id="scope" tabindex="-1" aria-hidden="true"><option value="current">النافذة الحالية</option><option value="all">كل النوافذ</option></select>
          </div>
        </div>
        <label class="opt switch-opt"><span>تضمين عنوان الصفحة</span><input type="checkbox" id="includeTitles" /><span class="switch"></span></label>
        <label class="opt switch-opt"><span>إزالة المكرر</span><input type="checkbox" id="removeDuplicates" /><span class="switch"></span></label>
        <label class="opt switch-opt"><span>تخطي صفحات النظام</span><input type="checkbox" id="skipSystem" /><span class="switch"></span></label>
        <div class="opt"><label id="sortOrderLabel">الترتيب</label>
          <div class="cselect" data-select="sortOrder">
            <button type="button" class="cselect-btn" aria-labelledby="sortOrderLabel" aria-haspopup="listbox" aria-expanded="false">
              <span class="cselect-value"></span>
              <span class="cselect-chev" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>
            </button>
            <ul class="cselect-menu" role="listbox" aria-labelledby="sortOrderLabel" hidden></ul>
            <select id="sortOrder" tabindex="-1" aria-hidden="true"><option value="original">الأصلي</option><option value="az">أبجدي</option><option value="domain">حسب الدومين</option></select>
          </div>
        </div>
        <div class="opt"><label id="numberFormatLabel">تنسيق الترقيم</label>
          <div class="cselect" data-select="numberFormat">
            <button type="button" class="cselect-btn" aria-labelledby="numberFormatLabel" aria-haspopup="listbox" aria-expanded="false">
              <span class="cselect-value"></span>
              <span class="cselect-chev" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>
            </button>
            <ul class="cselect-menu" role="listbox" aria-labelledby="numberFormatLabel" hidden></ul>
            <select id="numberFormat" tabindex="-1" aria-hidden="true"><option value="dot">1. الرابط</option><option value="paren">1) الرابط</option><option value="dash">- الرابط</option></select>
          </div>
        </div>
        <div class="opt"><label for="fileName">اسم الملف</label><input type="text" id="fileName" maxlength="60" /></div>
        <label class="opt switch-opt"><span>نسخ تلقائي للحافظة</span><input type="checkbox" id="autoCopy" /><span class="switch"></span></label>
        <label class="opt switch-opt"><span>الوضع الداكن</span><input type="checkbox" id="darkMode" /><span class="switch"></span></label>
        <label class="opt switch-opt"><span>حفظ السجل</span><input type="checkbox" id="saveHistory" /><span class="switch"></span></label>
      </div>
      <p id="statusMsg" class="status"></p>
    </section>
    <footer class="footer"><span>التغييرات تُحفظ فورًا في chrome.storage.local</span></footer>
  </div>
  <script type="module" src="options.js"></script>
</body>
</html>
